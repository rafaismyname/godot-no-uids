name: Update Homebrew Tap

on:
  # Called directly by the build workflows once they publish a release.
  # This is the path that actually runs for automated builds: releases created
  # with the default GITHUB_TOKEN do NOT emit a `release` event, so relying on
  # the trigger below alone would silently never fire.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to sync to the tap, e.g. 4.7.2-stable-nouid.'
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  # Covers releases published by a human through the GitHub UI.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)sync to the tap, e.g. 4.7.2-stable-nouid. Defaults to the latest release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    # Only the `release` trigger can carry a draft/prerelease; for workflow_call
    # and workflow_dispatch, github.event_name is the caller's event, so this
    # filter must not gate those paths.
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: macos-latest
    steps:
      - name: Resolve release tag and version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi

          VERSION="${TAG%-nouid}"
          VERSION="${VERSION%-stable}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch release asset checksums
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ASSETS_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets')

          SHA_MACOS=$(echo "$ASSETS_JSON" | jq -r '.[] | select(.name == "godot.macos.editor.zip") | .digest' | sed 's/^sha256://')
          SHA_LINUX=$(echo "$ASSETS_JSON" | jq -r '.[] | select(.name | endswith("-Linux")) | .digest' | sed 's/^sha256://')

          if [ -z "$SHA_MACOS" ] || [ -z "$SHA_LINUX" ]; then
            echo "::error::Could not find expected macOS/Linux release assets for tag $TAG"
            exit 1
          fi

          echo "sha_macos=$SHA_MACOS" >> "$GITHUB_OUTPUT"
          echo "sha_linux=$SHA_LINUX" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: rafaismyname/homebrew-godot-no-uids
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # Move the checkout into Homebrew's Taps directory so brew audits the
      # actual working tree. `brew tap <name> <path>` git-clones instead, which
      # only carries committed files -- the newly generated cask/formula for the
      # release being synced would be invisible, so validation would silently
      # only ever check versions that were already published.
      - name: Install tap into Homebrew
        run: |
          TAP_PATH="$(brew --repository)/Library/Taps/rafaismyname/homebrew-godot-no-uids"
          mkdir -p "$(dirname "$TAP_PATH")"
          rm -rf "$TAP_PATH"
          mv "$GITHUB_WORKSPACE/tap" "$TAP_PATH"
          echo "TAP_PATH=$TAP_PATH" >> "$GITHUB_ENV"

      - name: Generate cask/formula files
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA_MACOS: ${{ steps.sha.outputs.sha_macos }}
          SHA_LINUX: ${{ steps.sha.outputs.sha_linux }}
        run: |
          cd "$TAP_PATH"
          ruby scripts/generate.rb \
            --version "$VERSION" \
            --tag "$TAG" \
            --sha-macos "$SHA_MACOS" \
            --sha-linux "$SHA_LINUX"

      - name: Validate with brew style/audit
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          cd "$TAP_PATH"
          brew style Casks/ Formula/
          brew audit --cask "rafaismyname/godot-no-uids/godot-no-uids"
          brew audit --cask "rafaismyname/godot-no-uids/godot-no-uids@$VERSION"
          brew audit --formula "rafaismyname/godot-no-uids/godot-no-uids"
          brew audit --formula "rafaismyname/godot-no-uids/godot-no-uids@$VERSION"

      - name: Commit and push
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          cd "$TAP_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update to $VERSION"
          git pull --rebase origin master
          git push origin master
